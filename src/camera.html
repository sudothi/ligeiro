<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste da câmera · Dedos Ligeiros</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/camera.css">
</head>
<body class="cam-page">
<div class="bg-shapes" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<header class="cam-top">
  <a class="btn" href="index.html" id="btnCamBack">← Início</a>
  <h1>Teste da câmera</h1>
  <span class="chip" id="fps">—</span>
</header>

<main class="cam-main">
  <section class="cam-view">
    <canvas id="view" aria-label="Imagem da câmera com os números dos dedos"></canvas>
    <div class="cam-msg" id="loading">Abrindo a câmera…</div>
    <div class="cam-banner" id="banner" hidden></div>
    <div class="cam-results" id="results" hidden></div>
  </section>

  <aside class="cam-side">
    <div class="cam-card status" id="status" aria-live="polite">Abrindo a câmera…</div>

    <div class="cam-card picked">
      <span class="lbl" id="pickedLbl">Dedo dobrado</span>
      <div class="big" id="picked">–</div>
      <small id="pickedName">&nbsp;</small>
    </div>

    <div class="cam-card">
      <span class="lbl" id="barsLbl">Quanto cada dedo dobrou</span>
      <div class="bars" id="bars"></div>
    </div>

    <div class="cam-card actions">
      <button class="btn yellow" id="btnCalib">Calibrar</button>
      <button class="btn green" id="btnTest">Teste guiado</button>
    </div>

    <details class="cam-card opts">
      <summary>Ajustes da câmera</summary>
      <label>Câmera <select id="selCam"></select></label>
      <label>Gesto <select id="selGesture">
        <option value="levantar">Mãos na mesa: levantar um dedo</option>
        <option value="esticar">Mãos fechadas: esticar um dedo</option>
        <option value="dobrar">Mãos na mesa: dobrar um dedo</option>
      </select></label>
      <label class="chk"><input type="checkbox" id="optRotate"> Girar a imagem (de ponta-cabeça)</label>
      <label class="chk"><input type="checkbox" id="optMirror"> Espelhar a imagem</label>
      <label>Sensibilidade <input type="range" id="optSens" min="0.25" max="0.8" step="0.05"> <output id="outSens"></output></label>
      <label>Tempo segurando <input type="range" id="optHold" min="100" max="800" step="50"> <output id="outHold"></output></label>
    </details>
  </aside>
</main>

<script type="module" src="js/camera/camera.js"></script>
</body>
</html>
